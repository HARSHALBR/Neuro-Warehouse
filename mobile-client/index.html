<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeuroWarehouse — iQOO Operator Client</title>
  <link rel="stylesheet" href="/mobile/style.css">
  <style>
    :root {
      --bg-primary: #080d1a;
      --bg-card: rgba(13, 20, 36, 0.75);
      --bg-card-sub: rgba(8, 12, 22, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-blue: #38bdf8;
      --accent-purple: #d946ef;
      --accent-red: #f43f5e;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12), transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(217, 70, 239, 0.08), transparent 50%);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 14px;
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 4px;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
    }

    .logo-group h1 {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      background: var(--bg-card);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-dot.online {
      background-color: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulse 2s infinite;
    }

    .status-dot.offline {
      background-color: var(--accent-red);
    }

    /* Cards */
    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 14px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-header h2 {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-primary);
    }

    .selected-label {
      font-size: 0.75rem;
      font-family: monospace;
      font-weight: 800;
      color: var(--accent-purple);
      background: rgba(217, 70, 239, 0.15);
      padding: 3px 8px;
      border-radius: 8px;
      border: 1px solid rgba(217, 70, 239, 0.3);
    }

    /* Robot Grid */
    .robot-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .robot-btn {
      background: var(--bg-card-sub);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: all 0.18s ease;
      color: var(--text-primary);
    }

    .robot-btn:active {
      transform: scale(0.95);
    }

    .robot-btn .r-id {
      font-family: monospace;
      font-weight: 800;
      font-size: 0.95rem;
    }

    .robot-btn .r-bat {
      font-size: 0.7rem;
      font-family: monospace;
      color: var(--accent-green);
      font-weight: 700;
    }

    .robot-btn.selected {
      background: rgba(217, 70, 239, 0.22);
      border-color: var(--accent-purple);
      box-shadow: 0 0 16px rgba(217, 70, 239, 0.4);
      transform: translateY(-2px);
    }

    .robot-btn.failed {
      background: rgba(244, 63, 94, 0.25);
      border-color: var(--accent-red);
      animation: pulse 1s infinite;
    }

    .robot-btn.recovering {
      background: rgba(217, 70, 239, 0.25);
      border-color: var(--accent-purple);
    }

    /* Trigger Actions */
    .actions-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .actions-card h2 {
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .btn-primary {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      border: 1px solid rgba(244, 63, 94, 0.5);
      background: linear-gradient(135deg, #f43f5e, #dc2626);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(244, 63, 94, 0.4);
      transition: all 0.18s ease;
    }

    .btn-primary:active {
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(244, 63, 94, 0.4);
    }

    .secondary-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-secondary {
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-card-sub);
      color: var(--text-primary);
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .btn-secondary:active {
      transform: scale(0.97);
    }

    .btn-secondary.listening {
      background: rgba(244, 63, 94, 0.25);
      border-color: var(--accent-red);
      color: var(--accent-red);
      animation: pulse 1s infinite;
    }

    /* Confirmation Banner */
    .confirm-banner {
      display: none;
      padding: 14px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 700;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .confirm-banner.visible {
      display: block;
    }

    .confirm-banner.success {
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
    }

    .confirm-banner.error {
      background: rgba(244, 63, 94, 0.18);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #f87171;
    }

    .confirm-details {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 4px;
      font-family: monospace;
    }

    /* Sensor Feedback */
    .sensor-feedback {
      display: none;
      background: rgba(56, 189, 248, 0.1);
      border: 1px dashed rgba(56, 189, 248, 0.4);
      padding: 10px;
      border-radius: 14px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--accent-blue);
    }

    #qrVideo {
      display: none;
      width: 100%;
      border-radius: 12px;
      margin-top: 8px;
    }

    /* Event Log Feed */
    .event-feed {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
    }

    .event-item {
      font-family: monospace;
      font-size: 0.72rem;
      padding: 6px 8px;
      border-radius: 8px;
      background: var(--bg-card-sub);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .event-item.failure {
      border-color: rgba(244, 63, 94, 0.3);
      color: #fda4af;
      background: rgba(244, 63, 94, 0.1);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.02); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="mobile-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <span class="badge">iQOO FIELD OPERATOR</span>
        <h1>NeuroWarehouse</h1>
      </div>
      <div class="connection-status">
        <span class="status-dot online" id="wsDot"></span>
        <span id="wsStatus">Live 10Hz</span>
      </div>
    </header>

    <!-- Confirmation Toast / Banner -->
    <div id="confirmationBanner" class="confirm-banner">
      <div id="confirmMsg">Autonomous Recovery Dispatched</div>
      <div id="confirmDetails" class="confirm-details">Candidate R07 • A* Path Calculated</div>
    </div>

    <!-- Sensor / Voice Feedback Area -->
    <div id="sensorFeedback" class="sensor-feedback">
      <span id="sensorMessage">Processing sensor event...</span>
      <video id="qrVideo" playsinline></video>
    </div>

    <!-- 1. Select Target Robot -->
    <section class="section-card">
      <div class="section-header">
        <h2>1. Select Target Robot</h2>
        <span class="selected-label" id="selectedRobotLabel">Selected: R04</span>
      </div>
      <div class="robot-grid" id="robotGrid">
        <!-- Generated dynamically R01..R12 -->
      </div>
    </section>

    <!-- 2. Dispatch Incident -->
    <section class="section-card actions-card">
      <h2>2. Dispatch Operational Event</h2>
      
      <button class="btn-primary" id="btnTriggerFailure" onclick="dispatchManualFailure()">
        <span>⚠️</span>
        <span>TRIGGER ROBOT FAILURE</span>
      </button>

      <div class="secondary-actions">
        <button class="btn-secondary" id="btnVoice" onclick="toggleVoiceCommand()">
          <span id="voiceIcon">🎙️</span>
          <span id="voiceText">Voice Incident</span>
        </button>

        <button class="btn-secondary" id="btnCamera" onclick="toggleCameraScanner()">
          <span>📷</span>
          <span>Scan Robot QR</span>
        </button>
      </div>
    </section>

    <!-- 3. Telemetry Log Feed -->
    <section class="section-card">
      <div class="section-header">
        <h2>3. Mobile Telemetry Feed</h2>
      </div>
      <div class="event-feed" id="eventList">
        <div class="event-item">Ready for field disruption dispatch.</div>
      </div>
    </section>
  </div>

  <script src="/mobile/app.js"></script>
</body>
</html>
